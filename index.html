<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매장 근무 매뉴얼 예시</title>
<style>
:root{--bg:#0d1117;--panel:#171d25;--panel2:#202832;--line:#34404d;--text:#edf2f7;--muted:#9da8b5;--blue:#4b8dff;--yellow:#ffd54a;--red:#ff6b6b;--green:#5bd49a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#202a36 0,#0d1117 45%);color:var(--text);font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:1250px;min-height:100vh;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#252f3b,#151b23);border:1px solid #43505e;border-radius:12px;padding:22px 24px;box-shadow:0 16px 42px #0008}.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:10px;background:#386dc7;display:grid;place-items:center;font-weight:900;font-size:23px}.eyebrow{color:#8db7ff;font-size:12px;font-weight:800;letter-spacing:.08em}.title{margin:3px 0 0;font-size:27px}.subtitle{color:var(--muted);margin:8px 0 0;font-size:13px}
.search{display:flex;gap:8px;margin-top:20px}.search input{flex:1;height:48px;background:#0b0f14;border:1px solid #526171;border-radius:7px;color:#fff;padding:0 15px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4b8dff22}.search button{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 20px;font-weight:800}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.quick button{border:1px solid #506070;background:#283340;color:#dbe6f2;border-radius:20px;padding:6px 11px;font-size:12px}.quick button:hover,.quick button.active{background:#315d9f;border-color:#75a5ff}
.layout{display:grid;grid-template-columns:245px 1fr;gap:15px;margin-top:15px}.side,.content{background:#151b23;border:1px solid #35414e;border-radius:10px}.side{padding:12px;height:max-content;position:sticky;top:15px}.side h2{font-size:14px;margin:4px 6px 11px}.category{display:flex;width:100%;text-align:left;border:0;border-radius:6px;background:transparent;color:#cbd5e1;padding:11px 10px;gap:9px;align-items:center}.category:hover,.category.active{background:#293b55;color:#fff}.category b{margin-left:auto;background:#323e4b;color:#aebdcd;border-radius:15px;font-size:11px;padding:2px 7px}.legend{border-top:1px solid var(--line);margin-top:12px;padding:13px 7px 4px;color:var(--muted);font-size:11px;line-height:1.8}.content{padding:18px}.contentHead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:2px 2px 14px}.contentHead h2{margin:0;font-size:18px}.count{color:var(--muted);font-size:12px}.cards{display:grid;gap:11px;margin-top:14px}.card{background:#1c242e;border:1px solid #354351;border-radius:8px;overflow:hidden}.card.hidden{display:none}.cardHead{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer}.cardHead:hover{background:#222e3a}.num{min-width:29px;height:29px;border-radius:6px;background:#26384c;color:#8eb8ff;display:grid;place-items:center;font-size:12px;font-weight:900}.card h3{font-size:15px;margin:0}.arrow{margin-left:auto;color:#8b9aaa;font-size:16px}.cardBody{padding:0 15px 15px 54px;color:#d7e0e9;font-size:14px;line-height:1.75}.card.closed .cardBody{display:none}.card.closed .arrow{transform:rotate(-90deg)}.steps{margin:0;padding-left:19px}.steps li{padding:3px 0}.steps li::marker{color:#76a9ff;font-weight:800}.note{border-left:3px solid var(--yellow);background:#2d2b20;color:#ffe9a1;padding:10px 12px;margin-top:10px;border-radius:0 5px 5px 0}.danger{border-left-color:var(--red);background:#302124;color:#ffb8b8}.ok{border-left-color:var(--green);background:#20312b;color:#b6f1d4}.match{background:#705f1e;color:#fff09a;border-radius:3px;padding:0 2px}.empty{text-align:center;color:var(--muted);padding:55px 15px}.footer{color:#7f8b98;font-size:11px;text-align:center;padding:18px}
@media(max-width:800px){.app{padding:10px}.layout{grid-template-columns:1fr}.side{position:static}.side nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.legend{display:none}.title{font-size:21px}.content{padding:12px}.cardBody{padding-left:15px}.search button{padding:0 13px}}
.notice{display:flex;align-items:flex-start;gap:12px;margin-top:15px;padding:15px 17px;border:1px solid #a14d57;border-left:6px solid #ff6973;border-radius:9px;background:linear-gradient(90deg,#3a2026,#271d22);color:#ffe1e3;font-size:15px;font-weight:800;line-height:1.65}.notice strong{color:#ff858d;white-space:nowrap}.notice span{font-weight:500;color:#ffd1d4}.category{font-size:14px;min-height:45px;padding-right:4px}.minorCategory{padding-left:28px!important;font-size:13px}.categoryName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.categoryToggle{width:24px;border:0;background:transparent;color:#b9c9da;font-size:16px;font-weight:900;padding:2px}.categoryToggle:hover{color:#fff}.categoryTools{display:none}.categoryAddRow{display:flex;gap:5px}.addCategory{flex:1;margin-top:9px;border:1px dashed #5fc99b;background:#193d31;color:#8ff0be;border-radius:6px;padding:11px 5px;font-weight:900;font-size:12px}.addCategory:hover{background:#235a46}.categoryMenu{position:fixed;display:none;z-index:50;background:#202a35;border:1px solid #63778d;border-radius:6px;box-shadow:0 12px 30px #000;color:#fff;overflow:hidden}.categoryMenu button{display:block;width:190px;text-align:left;border:0;background:transparent;color:#fff;padding:11px 13px}.categoryMenu button:hover{background:#355778}.categoryMenu .dangerMenu{color:#ff9da4}.side h2{font-size:16px}.contentHead h2{font-size:21px}.count{font-size:14px}.cardHead{padding:16px 17px;min-height:62px}.card h3{font-size:17px}.num{min-width:34px;height:34px;font-size:13px}.cardBody{font-size:15px;line-height:1.85;padding:0 18px 18px 67px}.steps li{padding:5px 0}.note{font-size:14px;padding:12px 14px}.search input{height:54px;font-size:16px}.search button{font-size:14px}.quick button{font-size:13px;padding:8px 13px}.footer{font-size:13px;line-height:1.6}.headActions{display:flex;gap:7px}.headActions button{border:1px solid #5c718b;background:#29415d;color:#fff;border-radius:6px;padding:8px 11px;font-weight:800}.headActions .addBtn{background:#247d5b;border-color:#52c796}.editBtn{margin-left:auto;border:1px solid #60758e;background:#2a3c50;color:#cfe3ff;border-radius:5px;padding:5px 9px;font-size:12px}.editBtn:hover{background:#37618a}.editForm{width:min(680px,calc(100vw - 28px));background:#18212b;border:1px solid #536579;border-radius:10px;padding:20px;box-shadow:0 20px 60px #000}.editOverlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}.editForm h2{margin:0 0 15px}.editForm label{display:block;color:#b8c7d7;font-size:13px;font-weight:800;margin:11px 0 5px}.editForm input,.editForm textarea,.editForm select{width:100%;background:#0c1117;color:#fff;border:1px solid #536579;border-radius:5px;padding:9px}.editForm textarea{min-height:105px;resize:vertical}.editActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.editActions button{border:0;border-radius:5px;padding:10px 16px;background:#4f5d6c;color:#fff}.editActions .save{background:#2679d8;font-weight:800}.deleteBtn{margin-right:auto!important;background:#8d3642!important}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">PC</div><div><div class="eyebrow">STAFF TRAINING MANUAL</div><h1 class="title">매장 근무 매뉴얼 예시</h1><p class="subtitle">검색·분류·추가·수정·삭제 기능을 확인해보세요.</p></div></div>
 <div class="search"><input id="search" type="search" placeholder="예: 검색, 추가, 분류, 수정"><button id="clear">검색 초기화</button></div>
 <div class="quick" id="quick"></div>
 <div class="notice"><strong>공개용 예시</strong><span>이 페이지는 매뉴얼 사용 방법을 보여주는 배포용 예시입니다. 실제 업무 내용은 포함되어 있지 않습니다.</span></div>
</header>
<main class="layout">
 <aside class="side"><h2>업무 분류</h2><nav id="categories"></nav><div class="categoryAddRow"><button class="addCategory" id="addMajor">＋ 대분류</button><button class="addCategory" id="addMinor">＋ 소분류</button></div><div class="legend">대분류를 선택한 뒤 소분류를 추가하세요.<br>분류와 매뉴얼은 자동 저장됩니다.</div></aside>
 <section class="content"><div class="contentHead"><h2 id="sectionTitle">전체 업무</h2><div class="headActions"><span class="count" id="count"></span><button class="addBtn" id="addBtn">＋ 새 매뉴얼</button></div></div><div class="cards" id="cards"></div><div class="footer">배포용 예시 매뉴얼 · 이 컴퓨터의 브라우저 저장소에만 저장됩니다.</div></section>
</main>
</div>
<div class="editOverlay" id="editOverlay"><form class="editForm" id="editForm"><h2 id="formTitle">매뉴얼 수정</h2><label>업무 분류</label><select id="editCategory"></select><input id="newCategory" placeholder="새 분류 이름 (새 분류 만들기 선택 시)" style="display:none;margin-top:7px"><label>제목</label><input id="editTitle" required><label>상세 내용 (한 줄에 한 단계)</label><textarea id="editItems" required></textarea><label>메모 (선택)</label><input id="editNote"><div class="editActions"><button type="button" class="deleteBtn" id="deleteBtn">삭제</button><button type="button" id="cancelEdit">취소</button><button type="submit" class="save">저장</button></div></form></div>
<div class="categoryMenu" id="categoryMenu"><button id="menuEditCategory">✎ 업무 분류 이름 수정</button><button id="menuMoveCategory">↳ 대분류 아래로 이동</button><button id="menuDeleteCategory" class="dangerMenu">✕ 업무 분류 삭제</button></div>
<script>
'use strict';
const data=[
 {id:'example',icon:'01',title:'사용 예시',items:['왼쪽 업무 분류에서 원하는 분류를 선택합니다','상단 검색창에 키워드를 입력하면 관련 매뉴얼을 찾을 수 있습니다','새 매뉴얼 버튼으로 제목과 상세 내용을 추가할 수 있습니다','분류에서 마우스 오른쪽 버튼을 누르면 이름 수정·이동·삭제 메뉴가 표시됩니다'],note:'이 항목은 배포용 기능 설명 예시입니다.',type:'ok'}
];
data.forEach(x=>{if(!x.category)x.category=x.id});
const state={category:'all',query:''};
let collapsedCategories={};
let categories=[['all','전체 업무'],['example','사용 예시']];
const $=s=>document.querySelector(s);
const STORAGE_DB='pcManualPublicDemoDB',STORAGE_VERSION=2,STORAGE_STORE='settings',STORAGE_KEY='state';
function openStorage(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));const r=indexedDB.open(STORAGE_DB,STORAGE_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORAGE_STORE))r.result.createObjectStore(STORAGE_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});}
function idbGet(db,key){return new Promise((resolve,reject)=>{const r=db.transaction(STORAGE_STORE,'readonly').objectStore(STORAGE_STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});}
function idbSet(db,key,value){return new Promise((resolve,reject)=>{const r=db.transaction(STORAGE_STORE,'readwrite').objectStore(STORAGE_STORE).put(value,key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});}
function idbDelete(db,key){return new Promise((resolve,reject)=>{const r=db.transaction(STORAGE_STORE,'readwrite').objectStore(STORAGE_STORE).delete(key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});}
function saveLocal(){localStorage.setItem('pcManualPublicDemoData',JSON.stringify(data));localStorage.setItem('pcManualPublicDemoCategories',JSON.stringify(categories));localStorage.setItem('pcManualPublicDemoCollapsed',JSON.stringify(collapsedCategories))}
async function saveAll(){saveLocal();try{const db=await openStorage();await idbSet(db,STORAGE_KEY,{d:data,c:categories,x:collapsedCategories});await Promise.all(['data','categories','collapsed'].map(key=>idbDelete(db,key)));db.close()}catch(e){console.warn('IndexedDB 저장 실패: localStorage에는 저장되었습니다.',e)}}
async function loadAll(){let db;try{db=await openStorage();let stateData=await idbGet(db,STORAGE_KEY);if(!stateData){const saved=JSON.parse(localStorage.getItem('pcManualPublicDemoData')),savedCats=JSON.parse(localStorage.getItem('pcManualPublicDemoCategories')),savedCollapsed=JSON.parse(localStorage.getItem('pcManualPublicDemoCollapsed'));stateData={d:saved,c:savedCats,x:savedCollapsed};if(saved||savedCats||savedCollapsed){await idbSet(db,STORAGE_KEY,stateData);await Promise.all(['data','categories','collapsed'].map(key=>idbDelete(db,key)))}}if(stateData&&Array.isArray(stateData.d)&&stateData.d.length)data.splice(0,data.length,...stateData.d);if(stateData&&Array.isArray(stateData.c))categories=stateData.c;if(stateData&&stateData.x&&typeof stateData.x==='object')collapsedCategories=stateData.x;db.close()}catch(e){if(db)db.close();const saved=JSON.parse(localStorage.getItem('pcManualPublicDemoData')),savedCats=JSON.parse(localStorage.getItem('pcManualPublicDemoCategories')),savedCollapsed=JSON.parse(localStorage.getItem('pcManualPublicDemoCollapsed'));if(Array.isArray(saved)&&saved.length)data.splice(0,data.length,...saved);if(Array.isArray(savedCats))categories=savedCats;if(savedCollapsed&&typeof savedCollapsed==='object')collapsedCategories=savedCollapsed}data.forEach(x=>{if(!x.category)x.category=x.id});saveLocal()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlight(s){const q=state.query.trim();if(!q)return esc(s);return esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+')','gi'),'<span class="match">$1</span>');}
 function categoryMatches(id,selected){if(selected==='all')return true;if(id===selected)return true;const c=categories.find(v=>v[0]===id);return !!(c&&c[2]===selected)}
 function categoryBlock(c){const children=categories.filter(v=>v[2]===c[0]);const own=data.filter(x=>x.category===c[0]).length;const total=own+children.reduce((n,v)=>n+data.filter(x=>x.category===v[0]).length,0);const tools=c[0]!=='all'?`<span class="categoryTools"><button data-edit-category="${c[0]}" title="이름 수정">✎</button><button data-parent-category="${c[0]}" title="대분류 아래로 이동">↳</button><button class="categoryDelete" data-delete-category="${c[0]}" title="업무 분류 삭제">✕</button></span>`:'';const toggle=children.length?`<button class="categoryToggle" data-toggle-category="${c[0]}" title="소분류 펼치기/숨기기">${collapsedCategories[c[0]]?'▶':'▼'}</button>`:'<span class="categoryToggle"></span>';const childHtml=collapsedCategories[c[0]]?'':children.map(v=>`<div class="category minorCategory ${state.category===v[0]?'active':''}" data-cat="${v[0]}"><span>└</span><span class="categoryName">${v[1]}</span><b>${data.filter(x=>x.category===v[0]).length}</b><span class="categoryTools"><button data-edit-category="${v[0]}" title="이름 수정">✎</button><button data-parent-category="${v[0]}" title="다른 대분류로 이동">↳</button><button class="categoryDelete" data-delete-category="${v[0]}" title="업무 분류 삭제">✕</button></span></div>`).join('');return `<div class="category ${state.category===c[0]?'active':''}" data-cat="${c[0]}">${toggle}<span>${c[0]==='important'?'★':'▸'}</span><span class="categoryName">${c[1]}</span><b>${c[0]==='all'?data.length:total}</b>${tools}</div>`+childHtml}
 let contextCategoryId=null;
 function hideCategoryMenu(){$('#categoryMenu').style.display='none';contextCategoryId=null}
 function renderCategories(){const majors=categories.filter(c=>c[0]==='all'||!c[2]);$('#categories').innerHTML=majors.map(categoryBlock).join('');document.querySelectorAll('[data-cat]').forEach(b=>{b.onclick=e=>{if(e.target.closest('.categoryTools')||e.target.closest('.categoryToggle'))return;state.category=b.dataset.cat;render()};b.oncontextmenu=e=>{e.preventDefault();contextCategoryId=b.dataset.cat;const menu=$('#categoryMenu');menu.style.left=Math.min(e.clientX,window.innerWidth-205)+'px';menu.style.top=Math.min(e.clientY,window.innerHeight-150)+'px';menu.style.display='block'}});document.querySelectorAll('[data-toggle-category]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.toggleCategory;collapsedCategories[id]=!collapsedCategories[id];saveAll();renderCategories()});document.querySelectorAll('[data-delete-category]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteCategory(b.dataset.deleteCategory)});document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=e=>{e.stopPropagation();editCategory(b.dataset.editCategory)});document.querySelectorAll('[data-parent-category]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveCategoryToParent(b.dataset.parentCategory)}); }
 document.addEventListener('click',e=>{if(!e.target.closest('#categoryMenu'))hideCategoryMenu()});document.addEventListener('contextmenu',e=>{if(!e.target.closest('[data-cat]'))hideCategoryMenu()});$('#menuEditCategory').onclick=()=>{const id=contextCategoryId;hideCategoryMenu();if(id&&id!=='all')editCategory(id)};$('#menuMoveCategory').onclick=()=>{const id=contextCategoryId;hideCategoryMenu();if(id&&id!=='all')moveCategoryToParent(id)};$('#menuDeleteCategory').onclick=()=>{const id=contextCategoryId;hideCategoryMenu();if(id&&id!=='all')deleteCategory(id)};
 function renderQuick(){const qs=['검색 방법','새 매뉴얼','분류 관리','저장 방법'];$('#quick').innerHTML=qs.map(q=>`<button data-q="${q}">${q}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#search').value=b.dataset.q;state.query=b.dataset.q;render()});}
 $('#addMajor').onclick=()=>addCategory(null);$('#addMinor').onclick=()=>{if(state.category==='all'){alert('먼저 대분류를 선택하세요.');return}const parent=categories.find(c=>c[0]===state.category);addCategory(parent&&parent[2]?parent[2]:state.category)};
 function addCategory(parent){const name=prompt(parent?'추가할 소분류 이름을 입력하세요.':'추가할 대분류 이름을 입력하세요.');if(!name||!name.trim())return;const clean=name.trim();if(categories.some(c=>c[1]===clean&&c[2]===parent)){alert('같은 위치에 이미 있는 분류입니다.');return}const id='custom-category-'+Date.now();categories.push([id,clean,parent]);saveAll();state.category=id;render();}
 function deleteCategory(id){const c=categories.find(v=>v[0]===id);if(!c)return;const ids=[];function collect(parent){categories.forEach(v=>{if(v[0]===parent){ids.push(v[0]);categories.filter(child=>child[2]===v[0]).forEach(child=>collect(child[0]));}})}collect(id);const count=data.filter(x=>ids.indexOf(x.category)>=0).length;const subCount=Math.max(0,ids.length-1);const message=count?'이 분류와 하위 소분류 '+subCount+'개, 안에 있는 매뉴얼 '+count+'개를 함께 삭제할까요?':subCount?'이 분류와 하위 소분류 '+subCount+'개를 삭제할까요?':'이 업무 분류를 삭제할까요?';if(!confirm(message))return;for(let i=data.length-1;i>=0;i--)if(ids.indexOf(data[i].category)>=0)data.splice(i,1);categories=categories.filter(v=>ids.indexOf(v[0])<0);saveAll();state.category='all';render();}
 function editCategory(id){const c=categories.find(v=>v[0]===id);if(!c)return;const name=prompt('업무 분류 이름을 수정하세요.',c[1]);if(!name||!name.trim()||name.trim()===c[1])return;const clean=name.trim();if(categories.some(v=>v[0]!==id&&v[1]===clean)){alert('이미 있는 업무 분류 이름입니다.');return}c[1]=clean;saveAll();render();}
 function moveCategoryToParent(id){const c=categories.find(v=>v[0]===id);if(!c||c[0]==='all')return;const children=categories.filter(v=>v[2]===id);if(children.length){alert('하위 소분류가 있는 대분류는 먼저 소분류를 이동해 주세요.');return}const majors=categories.filter(v=>v[0]!=='all'&&!v[2]&&v[0]!==id);if(!majors.length){alert('먼저 대분류를 하나 이상 만들어 주세요.');return}const list=majors.map((v,i)=>(i+1)+'. '+v[1]).join('\n');const answer=prompt('이 업무 분류를 어느 대분류 아래로 옮길까요?\n'+list+'\n번호를 입력하세요.');const n=Number(answer);if(!n||n<1||n>majors.length)return;c[2]=majors[n-1][0];saveAll();state.category=id;render();}
 function moveCategory(id,direction){const index=categories.findIndex(v=>v[0]===id),target=index+direction;if(index<1||target<1||target>=categories.length)return;const temp=categories[index];categories[index]=categories[target];categories[target]=temp;saveAll();render();}
 function render(){const q=state.query.trim().toLowerCase();let list=data.filter(x=>categoryMatches(x.category,state.category)&&(!q||(x.title+' '+x.items.join(' ')+' '+(x.note||'')).toLowerCase().includes(q)));$('#sectionTitle').textContent=state.category==='all'?'전체 업무':categories.find(x=>x[0]===state.category)[1];$('#count').textContent=`${list.length}개 항목`;$('#cards').innerHTML=list.length?list.map((x,i)=>`<article class="card ${i>0?'closed':''}"><div class="cardHead"><span class="num">${x.icon}</span><h3>${highlight(x.title)}</h3><button class="editBtn" data-edit="${x.id}">✎ 수정</button><span class="arrow">⌄</span></div><div class="cardBody"><ol class="steps">${x.items.map(t=>`<li>${highlight(t)}</li>`).join('')}</ol>${x.note?`<div class="note ${x.type||''}">${highlight(x.note)}</div>`:''}</div></article>`).join(''):'<div class="empty">검색 결과가 없습니다.<br>다른 단어로 검색해 보세요.</div>';document.querySelectorAll('.cardHead').forEach(h=>h.onclick=e=>{if(!e.target.closest('.editBtn'))h.parentElement.classList.toggle('closed')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEditor(b.dataset.edit)});renderCategories();}

 let editingId=null;
 function fillCategorySelect(selected){$('#editCategory').innerHTML=categories.filter(c=>c[0]!=='all').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')+'<option value="__new__">＋ 새 분류 만들기</option>';$('#editCategory').value=selected||'counter';$('#newCategory').style.display=$('#editCategory').value==='__new__'?'block':'none';}
 function openEditor(id){editingId=id;const x=data.find(v=>v.id===id);const defaultCategory=(x&&x.category)||(state.category!=='all'?state.category:'counter');$('#formTitle').textContent=id?'매뉴얼 수정':'새 매뉴얼 추가';fillCategorySelect(defaultCategory);$('#editTitle').value=x?x.title:'';$('#editItems').value=x?x.items.join('\\n'):'';$('#editNote').value=x&&x.note?x.note:'';$('#deleteBtn').style.display=id?'block':'none';$('#editOverlay').style.display='flex';$('#editTitle').focus();}
 function closeEditor(){$('#editOverlay').style.display='none';editingId=null}
 $('#editCategory').addEventListener('change',()=>{$('#newCategory').style.display=$('#editCategory').value==='__new__'?'block':'none';if($('#editCategory').value==='__new__')$('#newCategory').focus()});
 $('#editForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#editTitle').value.trim(),items=$('#editItems').value.split(/\\n+/).map(v=>v.trim()).filter(Boolean),note=$('#editNote').value.trim();let category=$('#editCategory').value;if(category==='__new__'){const name=$('#newCategory').value.trim();if(!name)return;category='custom-'+Date.now();categories.push([category,name])}if(!title||!items.length)return;let x=data.find(v=>v.id===editingId);if(x){x.title=title;x.items=items;x.note=note;x.category=category}else{data.push({id:'custom-'+Date.now(),icon:'＋',title,items,note,category})}saveAll();closeEditor();render();});
 $('#deleteBtn').onclick=()=>{if(!editingId)return;const i=data.findIndex(v=>v.id===editingId);if(i>=0&&confirm('이 매뉴얼을 삭제할까요?')){data.splice(i,1);saveAll();closeEditor();render()}};$('#cancelEdit').onclick=closeEditor;$('#editOverlay').onclick=e=>{if(e.target.id==='editOverlay')closeEditor()};$('#addBtn').onclick=()=>openEditor(null);
 $('#search').addEventListener('input',e=>{state.query=e.target.value;render()});$('#clear').onclick=()=>{$('#search').value='';state.query='';state.category='all';render()};
 renderQuick();render();loadAll().then(()=>{renderQuick();render()}).catch(()=>{renderQuick();render()});
</script>
</body>
